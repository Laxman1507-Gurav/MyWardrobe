server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: shopsphere-digital-wardrobe

  datasource:
    url: jdbc:mysql://localhost:3306/mywardrobe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: SAISH@0601
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 30MB

app:
  jwt:
    secret: 9a6f8b3c1d2e5a7b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
    expiration-ms: 86400000 # 24 hours
  storage:
    upload-dir: ./uploads

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
